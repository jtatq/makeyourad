services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mya
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /var/lib/makeyourad/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mya -d mya"]
      interval: 5s
      timeout: 3s
      retries: 20
